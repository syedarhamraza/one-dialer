name: CI

on:
  pull_request:
  push:
    branches: [main, "beta/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Also generates android/gradlew, used below. No google-services.json, so Firebase is skipped.
      - run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Companion app
        if: hashFiles('companion/gradlew') != ''
        run: |
          echo "sdk.dir=$ANDROID_HOME" > companion/local.properties
          chmod +x companion/gradlew
          companion/gradlew -p companion test assembleDebug

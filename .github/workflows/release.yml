name: Release

# One Dialer to Google Play, the recorder APK to GitHub Releases, the notes to the website.
# Started by hand on the beta branch: Actions > Release > Run workflow (or the GitHub phone app).
# Setup, secrets and what to check afterwards: docs/pipeline-setup.md.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Version step (1.0.0-beta.7 -> next-beta: 1.0.0-beta.8, promote: 1.0.0, rebuild: same name, new build number)"
        type: choice
        default: next-beta
        options: [next-beta, next-alpha, promote, patch, minor, rebuild]
      track:
        description: "Google Play track (alpha = closed testing, beta = open testing; production is uploaded as a draft)"
        type: choice
        default: alpha
        options: [internal, alpha, beta, production]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Holds every secret below, and waits for its required reviewer before any step runs.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check setup
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::The release environment has no secrets yet. Follow docs/pipeline-setup.md."; exit 1; }

      # The deploy key is on the branch ruleset's bypass list, so the release commit can be pushed.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing and service files
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # All of these are git-ignored, so the tree stays clean for tool/release.ps1.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          echo "sdk.dir=$ANDROID_HOME" > companion/local.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Release Drafter keeps a draft GitHub release of merged pull requests; its "- " lines,
      # as copy-edited, become this version's notes.
      - name: Read the draft release
        id: draft
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)][0].id // empty')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/notes.md"
          [ -z "$id" ] || gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .body > "$RUNNER_TEMP/notes.md"

      # The same script as a release from the PC: checks, version bump, Changelog entry, signed
      # bundle, Crashlytics symbols, recorder APK, release commit and tag.
      - name: Version, build and sign
        id: build
        shell: pwsh
        env:
          KIND: ${{ inputs.kind }}
          # firebase-tools signs in with it for the symbol upload.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play.json
        run: |
          $flags = @{
            'next-beta'  = @{ Pre = 'beta' }
            'next-alpha' = @{ Pre = 'alpha' }
            'promote'    = @{ Promote = $true }
            'patch'      = @{ Bump = 'patch' }
            'minor'      = @{ Bump = 'minor' }
            'rebuild'    = @{ Rebuild = $true }
          }[$env:KIND]
          ./tool/release.ps1 -Yes -NotesFile "$env:RUNNER_TEMP/notes.md" @flags

      # Pushed before the Play upload: a build on Play always has its commit and tag here.
      # The push also redeploys the website (pages.yml) with the new changelog.json.
      - name: Push the release commit and tag
        run: |
          test -f build/app/outputs/bundle/release/app-release.aab
          test -f companion/app/build/outputs/apk/release/app-release.apk
          git push --follow-tags origin "HEAD:$GITHUB_REF_NAME"

      - name: Release notes for Play and GitHub
        run: |
          mkdir "$RUNNER_TEMP/whatsnew"
          # Play allows 500 characters: whole lines while they fit, and no trailing newline (-j).
          jq -rj 'reduce (.changes[] | "• " + .) as $l (""; (if . == "" then $l else . + "\n" + $l end) as $n | if ($n | length) <= 500 then $n else . end)' \
            site/public/changelog.json > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          jq -r '.changes[] | "- " + .' site/public/changelog.json > "$RUNNER_TEMP/release-notes.md"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: com.syedarhamraza.onedialer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}
          releaseName: ${{ steps.build.outputs.name }} (${{ steps.build.outputs.code }})
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # Never marked "pre-release": GitHub's releases/latest/download/one-dialer-recorder.apk
      # link, which the docs give out, skips pre-releases.
      - name: GitHub release with the recorder
        env:
          NAME: ${{ steps.build.outputs.name }}
          CODE: ${{ steps.build.outputs.code }}
          # A rebuild reuses its version's notes, so the draft still holds the next version's.
          DRAFT: ${{ inputs.kind != 'rebuild' && steps.draft.outputs.id || '' }}
        run: |
          tag="v$NAME"
          cp companion/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/one-dialer-recorder.apk"
          # Decodes this build's crashes (flutter symbolize); see docs/play-release.md.
          zip -qr "$RUNNER_TEMP/symbols-$NAME-$CODE.zip" symbols
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "One Dialer $NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
            # Its lines are in this release now; Release Drafter starts a new draft on the next merge.
            [ -z "$DRAFT" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/one-dialer-recorder.apk" "$RUNNER_TEMP/symbols-$NAME-$CODE.zip" --clobber

name: Internal build

# Every merge into `develop` goes to Google Play's internal testing track, so testers always have
# the newest code, through Play updates. Build number = commits on develop (tool/release.ps1
# -Internal), which the next release's commit is always above; the name stays the last release's.
#
# Setup, once: Settings > Environments > New environment "internal", deployment branches limited
# to `develop`, no required reviewer, with the same six secrets as "release" (UPLOAD_KEYSTORE_B64,
# UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD, GOOGLE_SERVICES_JSON,
# PLAY_SERVICE_ACCOUNT_JSON), and optionally DISCORD_BETA_WEBHOOK to post each build to Discord.
# Testers: Play Console > Testing > Internal testing > Testers.
on:
  push:
    branches: [develop]
    paths-ignore: ["site/**", "docs/**", "**.md", "graphify-out/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer merge replaces a build still running.
concurrency:
  group: internal-build
  cancel-in-progress: true

jobs:
  internal:
    # Not the Release workflow's own commit: that version goes out through Release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: internal
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check setup
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::The internal environment has no secrets yet."; exit 1; }

      # Full history: the build number is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing and service files
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # All git-ignored, so the tree stays clean for tool/release.ps1.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"

      - name: Build
        id: build
        shell: pwsh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play.json
        run: ./tool/release.ps1 -Internal

      # What changed: the merged pull request's title, unless it's skip-changelog (chores, and
      # anything about the recorder, which Play and the beta channel mustn't hear about).
      - name: What's new
        id: notes
        env:
          CODE: ${{ steps.build.outputs.code }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty')
          title=""
          if [ -n "$pr" ] && ! jq -e '[.labels[].name] | index("skip-changelog")' <<<"$pr" > /dev/null; then
            title=$(jq -r .title <<<"$pr")
            echo "url=$(jq -r .html_url <<<"$pr")" >> "$GITHUB_OUTPUT"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/whatsnew"
          printf '%s' "${title:-Test build $CODE}" | head -c 500 > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: com.syedarhamraza.onedialer
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.build.outputs.name }} (${{ steps.build.outputs.code }})
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # Only builds with a user-facing change, so the channel isn't one post per chore.
      - name: Post to Discord
        if: ${{ steps.notes.outputs.title != '' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
          NAME: ${{ steps.build.outputs.name }}
          CODE: ${{ steps.build.outputs.code }}
          TITLE: ${{ steps.notes.outputs.title }}
          URL: ${{ steps.notes.outputs.url }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "**$NAME (build $CODE)** is on internal testing: $TITLE"$'\n'"<$URL>" \
            '{content: $c, allowed_mentions: {parse: []}}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
